# nginx/nginx.conf
events {}

http {
  server {
    listen 80;
    server_name dbbusiness2berkah.store www.dbbusiness2berkah.store;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name dbbusiness2berkah.store www.dbbusiness2berkah.store;

    ssl_certificate /etc/letsencrypt/live/dbbusiness2berkah.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbbusiness2berkah.store/privkey.pem;

    location / {
      proxy_pass http://nestjs-app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}