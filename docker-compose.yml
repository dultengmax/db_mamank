version: '3'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - db
  db:
    image: postgres:17
    ports:
     - 5432:5432
    environment:
      POSTGRES_USER  :  postgres
      POSTGRES_PASSWORD : 123
      POSTGRES_DB : mydatabase
