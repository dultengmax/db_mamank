version: '3.8'
services:
  nestjs-app:
    build: .
    environment:
      - DATABASE_URL=postgresql://nestjs:qwerty1234@db:5432/nestjs_postgres
      - password="226bca3c-d192-4fd4-a622-8da16d14b7bd"
    depends_on:
      - db
  nginx:
    build:
      context: ./nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nestjs-app
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - app-network
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nestjs
      POSTGRES_PASSWORD: qwerty1234
      POSTGRES_DB: nestjs_postgres
    ports:
      - "5433:5433"
networks:
  app-network:
    driver: bridge