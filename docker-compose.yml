version: '3.8'
services:
  app:
    build: .
    environment:
      - DATABASE_URL=postgresql://nestjs:qwerty1234@db:5432/nestjs_postgres
      - password="226bca3c-d192-4fd4-a622-8da16d14b7bd"
    depends_on:
      - db
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nestjs
      POSTGRES_PASSWORD: qwerty1234
      POSTGRES_DB: nestjs_postgres
    ports:
      - "5432:5432"